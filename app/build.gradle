plugins {
    id 'com.android.application'
}

android {
    namespace "com.deliveryassist"
    compileSdk 34

    defaultConfig {
        applicationId "com.deliveryassist"
        minSdk 24          // Android 7.0+ — covers 95%+ of active devices
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Allow large assets (our HTML app)
    aaptOptions {
        noCompress 'html', 'js', 'css'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'   // Modern WebView features
    implementation 'com.google.android.material:material:1.12.0'
}
